; BlindSight main ESP32 (PlatformIO entry point)
;
; The platform is PINNED on purpose. Left unpinned, "platform = espressif32"
; resolved to 6.13.0 (framework-arduinoespressif32 ~3.20017.0 = Arduino core
; 2.0.17 / IDF 4.4), whose esp_now.h callback is
;   void (*)(const uint8_t *mac, const uint8_t *data, int len)
; while core 3.x (IDF 5.x) uses
;   void (*)(const esp_now_recv_info_t *, const uint8_t *data, int len)
; src/main.cpp compiles on both via #if ESP_ARDUINO_VERSION_MAJOR >= 3, but an
; unpinned platform makes builds irreproducible, which is how the mismatch was
; only discovered after it had shipped.
;
; To move to Arduino core 3.x instead, replace the platform line with:
;   platform = pioarduino/platform-espressif32@^53.03.11
; and re-test the camera driver and LittleFS upload.

[env:esp32dev]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
build_flags =
  -DCORE_DEBUG_LEVEL=3
build_src_filter = +<*>
