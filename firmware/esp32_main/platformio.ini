; BlindSight main ESP32 (PlatformIO entry point)
;
; v1.5: Wi-Fi + edge-server IP are configured at runtime via the tzapu
; WiFiManager captive portal ("BlindSight-Setup") and persisted in NVS.
; The canonical firmware is ../BlindSight_Main_ESP32.ino; src/main.cpp
; includes it so there is a single source of truth.
;
; The platform is PINNED on purpose. Left unpinned, "platform = espressif32"
; resolved to 6.13.0 (framework-arduinoespressif32 ~3.20017.0 = Arduino core
; 2.0.17 / IDF 4.4), whose esp_now.h callback is
;   void (*)(const uint8_t *mac, const uint8_t *data, int len)
; while core 3.x (IDF 5.x) uses
;   void (*)(const esp_now_recv_info_t *, const uint8_t *data, int len)
; The firmware compiles on both via #if ESP_ARDUINO_VERSION_MAJOR >= 3, but an
; unpinned platform makes builds irreproducible.
;
; To move to Arduino core 3.x instead, replace the platform line with:
;   platform = pioarduino/platform-espressif32@^53.03.11
; and re-test the camera driver and LittleFS upload.

[env:esp32dev]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
build_flags =
  -DCORE_DEBUG_LEVEL=3
build_src_filter = +<*>
; deep+ makes the Library Dependency Finder follow the #include "../....ino"
; wrapper so built-in libraries (Preferences, LittleFS, HTTPClient, ESP-NOW)
; and WiFiManager are all discovered. The default "chain" mode stops at the
; wrapper and misses Preferences.h.
lib_ldf_mode = deep+
lib_deps =
  tzapu/WiFiManager @ ^2.0.17
