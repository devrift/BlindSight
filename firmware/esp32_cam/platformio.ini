; BlindSight ESP32-CAM (PlatformIO entry point)
;
; Pinned for the same reason as firmware/esp32_main/platformio.ini: the camera
; driver renamed pin_sscb_* to pin_sccb_* (kept as a deprecated alias in an
; anonymous union) and the ESP-NOW callback signature changed across cores.
; src/main.cpp uses the current pin_sccb_* spelling, which needs esp32-camera
; >= v2.0.2 - satisfied by every core this platform pins.
;
; To move to Arduino core 3.x instead:
;   platform = pioarduino/platform-espressif32@^53.03.11

[env:esp32cam]
platform = espressif32@6.13.0
board = esp32cam
framework = arduino
monitor_speed = 115200
build_flags =
  -DCORE_DEBUG_LEVEL=3
  ; The AI-Thinker module has PSRAM; allow the camera driver to use it.
  -DBOARD_HAS_PSRAM
