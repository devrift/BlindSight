<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#05070c">
  <meta name="description" content="BlindSight: voice-first navigation companion for blind and low-vision users. Wake word, spoken answers, cloud vision via OpenRouter.">
  <title>BlindSight — Voice Companion</title>
  <link rel="manifest" href="/static/manifest.json">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <a class="skip-link" href="#mic-btn">Skip to the microphone button</a>

  <!-- Screen-reader announcements: the single assertive live region. -->
  <div id="sr-announcer" class="visually-hidden" role="status" aria-live="assertive" aria-atomic="true"></div>

  <header>
    <div class="brand">
      <img src="/static/icon.svg" alt="">
      <h1>BlindSight</h1>
    </div>
    <span class="badge" id="conn-status">Voice companion</span>
  </header>

  <main>
    <section class="card status-card" aria-hidden="true">
      <span id="mode-badge"><span class="dot"></span> Ready</span>
      <p id="status-line">Starting up…</p>
    </section>

    <section class="card mic-card">
      <button id="mic-btn" type="button" aria-label="Tap to speak. Tap again to stop listening or to interrupt the answer.">
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
          <line x1="12" y1="19" x2="12" y2="23"></line>
          <line x1="8" y1="23" x2="16" y2="23"></line>
        </svg>
      </button>
      <p id="mic-hint">Starting up…</p>
    </section>

    <section class="card controls-card" aria-label="Companion settings">
      <div class="control">
        <label for="wake-toggle">Wake word<br><small>“hey BlindSight”</small></label>
        <span class="switch">
          <input type="checkbox" id="wake-toggle" checked>
          <span class="track" aria-hidden="true"></span>
        </span>
      </div>
      <div class="control">
        <label for="camera-toggle">Include camera<br><small>with questions</small></label>
        <span class="switch">
          <input type="checkbox" id="camera-toggle" checked>
          <span class="track" aria-hidden="true"></span>
        </span>
      </div>
      <div class="control">
        <label for="language-select">Reply language</label>
        <select id="language-select" aria-label="Reply language"></select>
      </div>
      <div class="control">
        <span class="group-label" id="text-size-label">Text size</span>
        <span class="text-size-group" role="group" aria-labelledby="text-size-label">
          <button type="button" data-size="md" aria-pressed="true" aria-label="Normal text size">A</button>
          <button type="button" data-size="lg" aria-pressed="false" aria-label="Large text size">A+</button>
          <button type="button" data-size="xl" aria-pressed="false" aria-label="Extra large text size">A++</button>
        </span>
      </div>
      <div class="control">
        <button type="button" id="help-btn">Help<br><small>read the commands</small></button>
        <button type="button" id="stop-btn">Stop<br><small>silence me</small></button>
      </div>
      <div class="control">
        <button type="button" id="frame-btn">Camera frame<br><small>for sighted helpers</small></button>
        <img id="frame-img" alt="Latest camera frame" hidden style="width:72px;height:54px;object-fit:cover;border-radius:8px;">
      </div>
    </section>

    <section class="card" id="chat-log" role="log" aria-label="Conversation history" aria-live="off"></section>

    <form class="text-input-form" id="chat-form">
      <label class="visually-hidden" for="prompt-input">Type your question</label>
      <input type="text" id="prompt-input" placeholder="Or type a question here…" autocomplete="off">
      <button type="submit">Ask</button>
    </form>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
