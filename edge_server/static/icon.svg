<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </radialGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#334155" stroke-width="6"/>

  <!-- Radar Arc Waves (BlindSight Wavefronts) -->
  <path d="M 106 350 A 180 180 0 0 1 406 350" fill="none" stroke="#f59e0b" stroke-width="16" stroke-linecap="round" opacity="0.4"/>
  <path d="M 156 310 A 130 130 0 0 1 356 310" fill="none" stroke="#f59e0b" stroke-width="20" stroke-linecap="round" opacity="0.75" filter="url(#glow)"/>
  <path d="M 206 270 A 80 80 0 0 1 306 270" fill="none" stroke="#38bdf8" stroke-width="24" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Central Vision Eye / Emitter Core -->
  <circle cx="256" cy="240" r="38" fill="url(#beamGrad)" filter="url(#glow)"/>
  <circle cx="256" cy="240" r="16" fill="#0a0a0c"/>

  <!-- Acoustic Waves Below -->
  <path d="M 196 380 Q 256 420 316 380" fill="none" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" opacity="0.8"/>
  <path d="M 166 410 Q 256 460 346 410" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" opacity="0.4"/>
</svg>
