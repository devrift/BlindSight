name: Android APK

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest ships the Android SDK with licences pre-accepted; using
      # it directly is more stable than the setup-android action on new images.
      - name: Ensure SDK packages
        run: |
          yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "9.3.1"

      - name: Build debug APK
        # No --no-daemon: KSP2's shaded IntelliJ core needs daemon services and
        # crashes with "ApplicationManager.getApplication() is null" without it.
        run: gradle assembleDebug --stacktrace > /tmp/gradle-build.log 2>&1

      - name: Upload build log (also on failure, for diagnosis)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: /tmp/gradle-build.log
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: blindsight-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
