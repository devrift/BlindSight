name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            edge_server/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          # onnxruntime/ultralytics are heavy and not needed by the test suite:
          # the vision path is exercised through its failure contract instead.
          pip install "Flask>=3.0,<4" "Pillow>=10.0" numpy requests python-dotenv

      - name: Ruff
        run: ruff check .

      - name: Voice clip format (skips when clips are not generated)
        run: python tools/verify_wav.py || echo "::warning::LittleFS clips not generated; offline fallback is silent until generate_clips.sh runs"

      - name: Tests
        run: pytest -q tests/
