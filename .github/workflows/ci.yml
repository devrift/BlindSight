name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Web app build (TypeScript + Vite)
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python tools lint
        run: |
          python -m pip install --upgrade pip ruff
          ruff check tools/

      - name: Voice clip format (skips when clips are not generated)
        run: python tools/verify_wav.py || echo "::warning::LittleFS clips not generated; offline fallback is silent until tools/generate_clips.py runs"

      - name: Project report renders
        run: |
          python -m pip install reportlab
          python tools/make_report_pdf.py docs/PROJECT_REPORT.md /tmp/report-check.pdf
